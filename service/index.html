<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stremio</title>
    <script>window.__STREMIO_SERVER_URL__ = 'http://127.0.0.1:8080';</script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(rs) {
                rs.forEach(function(r) { r.unregister(); });
            }).catch(function(){});
        }
    </script>
    <link rel="stylesheet" href="webos-ui.css">
    <script>
        window.STREMIO_TWEAKS = (function() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'tweaks.json', false);
            xhr.send();
            return xhr.status === 200 ? JSON.parse(xhr.responseText) : {};
        })();
        // Apply the on/off choices saved from the settings panel over tweaks.json, then share them with the service
        (function(tweaks) {
            var overrides = {};
            try { overrides = JSON.parse(localStorage.getItem('twk.overrides') || '{}'); } catch (e) {}
            Object.keys(overrides).forEach(function(key) {
                var parts = key.split('.');
                tweaks[parts[0]] = tweaks[parts[0]] || {};
                tweaks[parts[0]][parts[1]] = overrides[key];
            });
            // The service outlives page reloads, so always send the effective values, not only the changed ones
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/__tweaks/overrides');
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify({
                'servers.useLan': (tweaks.servers || {}).useLan !== false,
                'readAhead.enabled': (tweaks.readAhead || {}).enabled !== false,
                'peerBoost.enabled': (tweaks.peerBoost || {}).enabled !== false,
                'readAhead.mergeSources': (tweaks.readAhead || {}).mergeSources !== false,
                'subtitles.convert': (tweaks.subtitles || {}).convert !== false,
                'subtitles.allowHttp': (tweaks.subtitles || {}).allowHttp === true
            }));
        })(window.STREMIO_TWEAKS);
    </script>
    <script>
        // One overlay at a time: opening a panel closes the others, and Back closes the open panel before the app sees it
        window.__twkPanels = (function() {
            var panels = {};
            var current = null;
            return {
                add: function(name, close) { panels[name] = close; },
                opened: function(name) {
                    Object.keys(panels).forEach(function(other) { if (other !== name) panels[other](); });
                    current = name;
                },
                closed: function(name) { if (current === name) current = null; },
                current: function() { return current; }
            };
        })();
        window.addEventListener('keydown', function(e) {
            var name = window.__twkPanels.current();
            if (!name || (e.keyCode !== 461 && e.keyCode !== 27 && e.keyCode !== 8)) return;
            e.preventDefault();
            e.stopImmediatePropagation();
            window.__twkPanels.opened(null);
        }, true);
    </script>
    <script defer src="webos-debug.js"></script>
    <script defer src="webos-enhance.js"></script>
    <script defer src="webos-retry.js"></script>
    <script defer src="webos-subs.js"></script>
    <script defer src="webos-subsync.js"></script>
    <script defer src="webos-doctor.js"></script>
    <script defer src="webos-sources.js"></script>
    <script defer src="webos-settings.js"></script>
    <script defer src="webos-diag.js"></script>
    <script defer src="runtime.js"></script>
    <script defer src="main.js"></script>
    <script defer src="service.js"></script>
    <script defer src="webOSTV.js"></script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
</html>
